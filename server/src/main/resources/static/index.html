<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 研友汇考研交流平台</title><link rel="stylesheet" href="/style.css"></head><body class="auth-body">
<main class="auth-page"><section class="auth-story"><div class="auth-brand"><span class="brand-mark">研</span><b>研友汇</b></div><div class="story-copy"><span class="eyebrow">POSTGRADUATE COMMUNITY</span><h1>一起交流，认真备考，<br>让上岸更有方向。</h1><p>课程规划、每日任务、刷题反馈、院校选择、研友交流与复试准备，都在同一个考研交流平台持续推进。</p><div class="feature-pills"><span>研友交流</span><span>学习闭环</span><span>择校参考</span></div></div><div class="story-foot">考研交流平台 · Spring Boot 单体应用</div></section>
<section class="auth-form-wrap"><div class="auth-form-card"><div class="mobile-brand"><span class="brand-mark">研</span><b>研友汇</b></div><span class="eyebrow blue">WELCOME BACK</span><h2>登录交流平台</h2><p class="auth-hint">选择测试身份，继续你的备考计划</p><div class="role-switch"><button type="button" data-account="user,user123" class="selected"><b>普通用户</b><small>学习、刷题与交流</small></button><button type="button" data-account="admin,admin123"><b>管理员</b><small>内容与用户管理</small></button></div><form id="loginForm"><label>账号<input id="username" value="user" autocomplete="username" required></label><label>密码<input id="password" type="password" value="user123" autocomplete="current-password" required></label><button type="submit" class="login-submit"><span>进入平台</span><span>→</span></button><p id="loginError" class="error"></p></form><p class="account-tip">测试账号已自动填入，无需注册</p></div></section></main><script src="/login.js?v=4"></script></body></html>
